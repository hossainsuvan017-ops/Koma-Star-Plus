<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koma Star Plus - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#080808;
  color:white;
}

header{
  background:linear-gradient(135deg,#111,#260000);
  padding:20px;
  text-align:center;
  border-bottom:1px solid #333;
}

header h1{
  color:#ff2020;
  font-size:28px;
}

header p{
  color:#aaa;
  margin-top:6px;
}

.container{
  width:95%;
  max-width:1100px;
  margin:20px auto;
}

.card{
  background:#121212;
  border:1px solid #292929;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.card h2{
  margin-bottom:18px;
  color:#fff;
}

label{
  display:block;
  margin:12px 0 7px;
  color:#ccc;
  font-size:14px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  background:#1d1d1d;
  color:white;
  border:1px solid #444;
  border-radius:9px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,select:focus,textarea:focus{
  border-color:#ff2020;
}

button{
  border:0;
  padding:13px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.btn{
  background:#e50914;
  color:white;
  width:100%;
  margin-top:18px;
}

.btn:hover{
  background:#ff2630;
}

.delete{
  background:#b00020;
  color:white;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }
}

.upload-box{
  border:2px dashed #444;
  padding:18px;
  border-radius:12px;
  margin-top:10px;
  background:#0d0d0d;
}

.upload-box input{
  background:transparent;
  border:0;
  padding:5px 0;
}

.preview{
  margin-top:15px;
  display:none;
}

.preview img{
  width:160px;
  max-width:100%;
  border-radius:10px;
  display:block;
}

.preview video{
  width:100%;
  max-height:300px;
  border-radius:10px;
  display:block;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
  background:#171717;
}

.item{
  background:#181818;
  border:1px solid #303030;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.item h3{
  margin-bottom:8px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:6px;
  background:#333;
  font-size:12px;
  margin:3px;
}

.free{
  background:#087f23;
}

.premium{
  background:#8d0909;
}

.small{
  color:#999;
  font-size:13px;
  margin-top:5px;
}
</style>
</head>

<body>

<header>
  <h1>⭐ KOMA STAR PLUS</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

<!-- ADD MOVIE / SHOW -->

<div class="card">

<h2>🎬 Add Movie / Show</h2>

<div class="grid">

<div>
<label>Title</label>
<input id="title" type="text" placeholder="Enter movie/show name">
</div>

<div>
<label>Content Type</label>
<select id="type">
<option value="movie">Movie</option>
<option value="series">Series</option>
<option value="reality">Reality Show</option>
<option value="sports">Sports</option>
<option value="live">Live TV</option>
</select>
</div>

<div>
<label>Category</label>
<input id="category" type="text" placeholder="Action, Drama, Comedy...">
</div>

<div>
<label>Access</label>
<select id="access">
<option value="free">Free Watch</option>
<option value="premium">Premium</option>
</select>
</div>

<div>
<label>Release Year</label>
<input id="year" type="number" placeholder="2026">
</div>

<div>
<label>Duration</label>
<input id="duration" type="text" placeholder="2h 15m">
</div>

</div>

<label>Description</label>
<textarea id="description" placeholder="Write description..."></textarea>


<!-- THUMBNAIL -->

<div class="upload-box">

<label>🖼️ Gallery থেকে Thumbnail নির্বাচন করুন</label>

<input
  id="thumbnailFile"
  type="file"
  accept="image/*"
>

<div id="imagePreview" class="preview">
<img id="previewImage">
</div>

</div>


<!-- VIDEO -->

<div class="upload-box">

<label>🎥 Gallery থেকে Video নির্বাচন করুন</label>

<input
  id="videoFile"
  type="file"
  accept="video/*"
>

<div id="videoPreview" class="preview">

<video id="previewVideo" controls playsinline></video>

</div>

</div>

<button class="btn" onclick="addVideo()">
➕ Add Content
</button>

<div id="videoStatus" class="status"></div>

</div>


<!-- ADD EPISODE -->

<div class="card">

<h2>📺 Add Episode</h2>

<div class="grid">

<div>
<label>Series Name</label>
<input id="seriesName" type="text" placeholder="Series name">
</div>

<div>
<label>Season</label>
<input id="season" type="number" placeholder="1">
</div>

<div>
<label>Episode Number</label>
<input id="episodeNumber" type="number" placeholder="1">
</div>

<div>
<label>Episode Title</label>
<input id="episodeTitle" type="text" placeholder="Episode title">
</div>

</div>

<label>Episode Access</label>

<select id="episodeAccess">

<option value="free">
Free Episode
</option>

<option value="premium">
Premium Episode
</option>

</select>


<div class="upload-box">

<label>🖼️ Episode Thumbnail</label>

<input
 id="episodeThumbnail"
 type="file"
 accept="image/*"
>

<div id="episodeImagePreview" class="preview">
<img id="previewEpisodeImage">
</div>

</div>


<div class="upload-box">

<label>🎥 Episode Video</label>

<input
 id="episodeVideo"
 type="file"
 accept="video/*"
>

<div id="episodeVideoPreview" class="preview">

<video
 id="previewEpisodeVideo"
 controls
 playsinline>
</video>

</div>

</div>


<button class="btn" onclick="addEpisode()">
➕ Add Episode
</button>

<div id="episodeStatus" class="status"></div>

</div>


<!-- CONTENT LIBRARY -->

<div class="card">

<h2>📚 Content Library</h2>

<div id="contentList">
Loading...
</div>

</div>


<!-- EPISODE LIBRARY -->

<div class="card">

<h2>🎞️ Episode Library</h2>

<div id="episodeList">
Loading...
</div>

</div>

</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 deleteDoc,
 doc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

 apiKey:
 "AIzaSyD9Qt5x69KsB3VxOuvTbrDXYJHF3nN5acs",

 authDomain:
 "koma-star.firebaseapp.com",

 projectId:
 "koma-star",

 storageBucket:
 "koma-star.firebasestorage.app",

 messagingSenderId:
 "314141087569",

 appId:
 "1:314141087569:web:e1861e72db4f9ef5b12570",

 measurementId:
 "G-HYF2PZY5GR"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* -------------------------
   IMAGE PREVIEW
------------------------- */

document
.getElementById("thumbnailFile")
.addEventListener("change", function(){

 const file=this.files[0];

 if(!file)return;

 const url=URL.createObjectURL(file);

 const img=document.getElementById("previewImage");

 img.src=url;

 document.getElementById("imagePreview")
 .style.display="block";

});


/* -------------------------
   VIDEO PREVIEW
------------------------- */

document
.getElementById("videoFile")
.addEventListener("change", function(){

 const file=this.files[0];

 if(!file)return;

 const url=URL.createObjectURL(file);

 const video=document.getElementById("previewVideo");

 video.src=url;

 document.getElementById("videoPreview")
 .style.display="block";

});


/* -------------------------
   EPISODE IMAGE
------------------------- */

document
.getElementById("episodeThumbnail")
.addEventListener("change", function(){

 const file=this.files[0];

 if(!file)return;

 const url=URL.createObjectURL(file);

 document.getElementById("previewEpisodeImage")
 .src=url;

 document.getElementById("episodeImagePreview")
 .style.display="block";

});


/* -------------------------
   EPISODE VIDEO
------------------------- */

document
.getElementById("episodeVideo")
.addEventListener("change", function(){

 const file=this.files[0];

 if(!file)return;

 const url=URL.createObjectURL(file);

 document.getElementById("previewEpisodeVideo")
 .src=url;

 document.getElementById("episodeVideoPreview")
 .style.display="block";

});


/* -------------------------
   ADD VIDEO
------------------------- */

window.addVideo = async function(){

 const title =
 document.getElementById("title").value.trim();

 if(!title){

  alert("Title দিন");

  return;

 }

 const thumbnail =
 document.getElementById("thumbnailFile").files[0];

 const video =
 document.getElementById("videoFile").files[0];


 const data={

  title:title,

  type:
  document.getElementById("type").value,

  category:
  document.getElementById("category").value,

  access:
  document.getElementById("access").value,

  year:
  document.getElementById("year").value,

  duration:
  document.getElementById("duration").value,

  description:
  document.getElementById("description").value,

  thumbnailFileName:
  thumbnail ? thumbnail.name : "",

  videoFileName:
  video ? video.name : "",

  createdAt:
  serverTimestamp()

 };


 try{

  await addDoc(
   collection(db,"videos"),
   data
  );

  showStatus(
   "videoStatus",
   "✅ Content successfully added!"
  );

  clearVideoForm();

  loadVideos();

 }catch(error){

  console.error(error);

  showStatus(
   "videoStatus",
   "❌ Error: "+error.message
  );

 }

};


/* -------------------------
   ADD EPISODE
------------------------- */

window.addEpisode = async function(){

 const seriesName =
 document.getElementById("seriesName")
 .value.trim();

 const episodeTitle =
 document.getElementById("episodeTitle")
 .value.trim();

 if(!seriesName){

  alert("Series Name দিন");

  return;

 }

 if(!episodeTitle){

  alert("Episode Title দিন");

  return;

 }


 const thumbnail =
 document.getElementById("episodeThumbnail")
 .files[0];

 const video =
 document.getElementById("episodeVideo")
 .files[0];


 const data={

  seriesName:seriesName,

  season:
  document.getElementById("season").value,

  episodeNumber:
  document.getElementById("episodeNumber").value,

  episodeTitle:episodeTitle,

  access:
  document.getElementById("episodeAccess").value,

  thumbnailFileName:
  thumbnail ? thumbnail.name : "",

  videoFileName:
  video ? video.name : "",

  createdAt:
  serverTimestamp()

 };


 try{

  await addDoc(
   collection(db,"episodes"),
   data
  );

  showStatus(
   "episodeStatus",
   "✅ Episode successfully added!"
  );

  clearEpisodeForm();

  loadEpisodes();

 }catch(error){

  console.error(error);

  showStatus(
   "episodeStatus",
   "❌ Error: "+error.message
  );

 }

};


/* -------------------------
   LOAD VIDEOS
------------------------- */

async function loadVideos(){

 const list=
 document.getElementById("contentList");

 list.innerHTML="Loading...";

 try{

  const snapshot=
  await getDocs(
   collection(db,"videos")
  );

  list.innerHTML="";

  if(snapshot.empty){

   list.innerHTML=
   "<p>No content added yet.</p>";

   return;

  }


  snapshot.forEach(item=>{

   const data=item.data();

   const accessClass=
   data.access==="premium"
   ? "premium"
   : "free";

   const div=
   document.createElement("div");

   div.className="item";

   div.innerHTML=`

   <h3>
   ${escapeHTML(data.title || "")}
   </h3>

   <span class="badge">
   ${escapeHTML(data.type || "")}
   </span>

   <span class="badge ${accessClass}">
   ${data.access==="premium"
   ?"PREMIUM"
   :"FREE WATCH"}
   </span>

   <p class="small">
   Category:
   ${escapeHTML(data.category || "-")}
   </p>

   <p class="small">
   Year:
   ${escapeHTML(data.year || "-")}
   </p>

   <p class="small">
   Duration:
   ${escapeHTML(data.duration || "-")}
   </p>

   <p class="small">
   Thumbnail:
   ${escapeHTML(data.thumbnailFileName || "None")}
   </p>

   <p class="small">
   Video:
   ${escapeHTML(data.videoFileName || "None")}
   </p>

   <button
   class="delete"
   onclick="deleteVideo('${item.id}')">
   🗑 Delete
   </button>

   `;

   list.appendChild(div);

  });


 }catch(error){

  list.innerHTML=
  "❌ "+escapeHTML(error.message);

 }

}


/* -------------------------
   DELETE VIDEO
------------------------- */

window.deleteVideo =
async function(id){

 if(!confirm(
 "এই content delete করতে চান?"
 ))return;

 try{

  await deleteDoc(
   doc(db,"videos",id)
  );

  loadVideos();

 }catch(error){

  alert(error.message);

 }

};


/* -------------------------
   LOAD EPISODES
------------------------- */

async function loadEpisodes(){

 const list=
 document.getElementById("episodeList");

 list.innerHTML="Loading...";

 try{

  const snapshot=
  await getDocs(
   collection(db,"episodes")
  );

  list.innerHTML="";

  if(snapshot.empty){

   list.innerHTML=
   "<p>No episodes added yet.</p>";

   return;

  }


  snapshot.forEach(item=>{

   const data=item.data();

   const div=
   document.createElement("div");

   div.className="item";

   div.innerHTML=`

   <h3>
   ${escapeHTML(data.seriesName || "")}
   </h3>

   <span class="badge">
   S${escapeHTML(data.season || "1")}
   </span>

   <span class="badge">
   EP ${escapeHTML(data.episodeNumber || "1")}
   </span>

   <span class="badge ${
   data.access==="premium"
   ?"premium"
   :"free"
   }">

   ${
   data.access==="premium"
   ?"PREMIUM"
   :"FREE EPISODE"
   }

   </span>

   <p class="small">
   Episode:
   ${escapeHTML(data.episodeTitle || "")}
   </p>

   <p class="small">
   Video:
   ${escapeHTML(data.videoFileName || "None")}
   </p>

   <button
   class="delete"
   onclick="deleteEpisode('${item.id}')">

   🗑 Delete

   </button>

   `;

   list.appendChild(div);

  });


 }catch(error){

  list.innerHTML=
  "❌ "+escapeHTML(error.message);

 }

}


/* -------------------------
   DELETE EPISODE
------------------------- */

window.deleteEpisode =
async function(id){

 if(!confirm(
 "এই episode delete করতে চান?"
 ))return;

 try{

  await deleteDoc(
   doc(db,"episodes",id)
  );

  loadEpisodes();

 }catch(error){

  alert(error.message);

 }

};


/* -------------------------
   STATUS
------------------------- */

function showStatus(id,message){

 const box=
 document.getElementById(id);

 box.innerText=message;

 box.style.display="block";

 setTimeout(()=>{

  box.style.display="none";

 },4000);

}


/* -------------------------
   CLEAR VIDEO FORM
------------------------- */

function clearVideoForm(){

 document.getElementById("title").value="";
 document.getElementById("category").value="";
 document.getElementById("year").value="";
 document.getElementById("duration").value="";
 document.getElementById("description").value="";

 document.getElementById("thumbnailFile").value="";
 document.getElementById("videoFile").value="";

 document.getElementById("imagePreview")
 .style.display="none";

 document.getElementById("videoPreview")
 .style.display="none";

}


/* -------------------------
   CLEAR EPISODE FORM
------------------------- */

function clearEpisodeForm(){

 document.getElementById("seriesName").value="";
 document.getElementById("season").value="";
 document.getElementById("episodeNumber").value="";
 document.getElementById("episodeTitle").value="";

 document.getElementById("episodeThumbnail").value="";
 document.getElementById("episodeVideo").value="";

 document.getElementById("episodeImagePreview")
 .style.display="none";

 document.getElementById("episodeVideoPreview")
 .style.display="none";

}


/* -------------------------
   SECURITY DISPLAY HELPER
------------------------- */

function escapeHTML(value){

 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


/* -------------------------
   INITIAL LOAD
------------------------- */

loadVideos();

loadEpisodes();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koma Star Plus — Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#070707;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}
header{
  background:linear-gradient(135deg,#160000,#080808);
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #272727
}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;color:#999;font-size:13px}

.container{
  width:min(1100px,94%);
  margin:20px auto
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:18px
}
.card small{color:#999}
.card strong{
  display:block;
  font-size:28px;
  margin-top:8px
}

.panel{
  background:#101010;
  border:1px solid #292929;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px
}

h2{margin-top:0}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}

label{
  display:block;
  font-size:13px;
  color:#bbb;
  margin-bottom:6px
}

input,select,textarea{
  width:100%;
  padding:12px;
  background:#181818;
  border:1px solid #333;
  color:#fff;
  border-radius:9px;
  outline:none
}

textarea{min-height:100px;resize:vertical}

input:focus,select:focus,textarea:focus{
  border-color:#e50914
}

.full{grid-column:1/-1}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold
}

.primary{
  background:#e50914;
  color:white
}

.secondary{
  background:#292929;
  color:white
}

.danger{
  background:#7d1010;
  color:white
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

.preview{
  max-width:180px;
  max-height:130px;
  border-radius:10px;
  margin-top:10px;
  display:block
}

.hidden{display:none}

.library-search{
  margin-bottom:15px
}

.item{
  background:#171717;
  border:1px solid #292929;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px
}

.item-title{
  font-size:17px;
  font-weight:bold
}

.meta{
  color:#999;
  font-size:12px;
  margin:7px 0
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#292929;
  font-size:11px;
  margin-right:5px
}

.badge.free{background:#075b32}
.badge.premium{background:#8a5a00}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px
}

.status{
  padding:10px;
  border-radius:8px;
  margin-bottom:15px;
  display:none
}

.success{background:#063d23;color:#7cffb5}
.error{background:#4a0808;color:#ff9b9b}

.empty{
  text-align:center;
  color:#777;
  padding:25px
}

@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
}

@media(max-width:500px){
  .grid{grid-template-columns:1fr 1fr}
  .container{width:94%}
  .panel{padding:14px}
}
</style>
</head>

<body>

<header>
  <h1>⭐ Koma Star Plus — Admin Panel</h1>
  <p>Content Management Dashboard</p>
</header>

<div class="container">

  <div id="status" class="status"></div>

  <!-- DASHBOARD -->
  <div class="grid">
    <div class="card">
      <small>Total Content</small>
      <strong id="totalVideos">0</strong>
    </div>

    <div class="card">
      <small>Free Content</small>
      <strong id="freeVideos">0</strong>
    </div>

    <div class="card">
      <small>Premium Content</small>
      <strong id="premiumVideos">0</strong>
    </div>

    <div class="card">
      <small>Total Episodes</small>
      <strong id="totalEpisodes">0</strong>
    </div>
  </div>

  <!-- ADD CONTENT -->
  <div class="panel">
    <h2>➕ Add Content</h2>

    <form id="contentForm">

      <div class="form-grid">

        <div>
          <label>Title</label>
          <input id="title" required placeholder="Movie / Show name">
        </div>

        <div>
          <label>Type</label>
          <select id="type">
            <option value="movie">Movie</option>
            <option value="series">Series / Serial</option>
            <option value="reality">Reality Show</option>
            <option value="sports">Sports</option>
            <option value="live">Live TV</option>
          </select>
        </div>

        <div>
          <label>Category</label>
          <input id="category" placeholder="Action, Drama, Comedy...">
        </div>

        <div>
          <label>Access</label>
          <select id="access">
            <option value="free">Free Watch</option>
            <option value="premium">Premium</option>
          </select>
        </div>

        <div>
          <label>Year</label>
          <input id="year" type="number" placeholder="2026">
        </div>

        <div>
          <label>Duration</label>
          <input id="duration" placeholder="2h 10m">
        </div>

        <div>
          <label>Thumbnail URL</label>
          <input id="thumbnail" type="url" placeholder="https://.../poster.jpg">
        </div>

        <div>
          <label>Video URL</label>
          <input id="video" type="url" placeholder="https://.../video.mp4">
        </div>

        <div class="full">
          <label>Description</label>
          <textarea id="description"
          placeholder="Write description..."></textarea>
        </div>

        <!-- LOCAL THUMBNAIL -->
        <div>
          <label>Choose Thumbnail From Gallery</label>
          <input id="thumbnailFile" type="file" accept="image/*">
          <img id="thumbnailPreview" class="preview hidden">
        </div>

        <!-- LOCAL VIDEO -->
        <div>
          <label>Choose Video From Gallery</label>
          <input id="videoFile" type="file" accept="video/*">
          <video id="videoPreview"
                 class="preview hidden"
                 controls></video>
        </div>

        <div class="full">
          <button class="primary" type="submit">
            Publish Content
          </button>

          <button class="secondary"
                  type="button"
                  onclick="resetForm()">
            Clear
          </button>
        </div>

      </div>

    </form>
  </div>

  <!-- CONTENT LIBRARY -->
  <div class="panel">
    <h2>🎬 Content Library</h2>

    <input
      id="search"
      class="library-search"
      placeholder="Search movies, series, reality shows..."
    >

    <div id="contentList">
      <div class="empty">Loading...</div>
    </div>
  </div>

  <!-- EPISODES -->
  <div class="panel">
    <h2>📺 Add Episode</h2>

    <form id="episodeForm">

      <div class="form-grid">

        <div>
          <label>Series ID</label>
          <input id="seriesId"
                 required
                 placeholder="Firestore video ID">
        </div>

        <div>
          <label>Season Number</label>
          <input id="season"
                 type="number"
                 min="1"
                 value="1">
        </div>

        <div>
          <label>Episode Number</label>
          <input id="episode"
                 type="number"
                 min="1"
                 value="1">
        </div>

        <div>
          <label>Episode Title</label>
          <input id="episodeTitle"
                 required
                 placeholder="Episode title">
        </div>

        <div>
          <label>Access</label>
          <select id="episodeAccess">
            <option value="free">Free Episode</option>
            <option value="premium">Premium</option>
          </select>
        </div>

        <div>
          <label>Episode Video URL</label>
          <input id="episodeVideo"
                 type="url"
                 required
                 placeholder="https://.../episode.mp4">
        </div>

        <div class="full">
          <label>Episode Thumbnail URL</label>
          <input id="episodeThumbnail"
                 type="url"
                 placeholder="https://.../episode.jpg">
        </div>

        <div class="full">
          <button class="primary" type="submit">
            Add Episode
          </button>
        </div>

      </div>

    </form>
  </div>

  <!-- EPISODE LIBRARY -->
  <div class="panel">
    <h2>📚 Episode Library</h2>
    <div id="episodeList">
      <div class="empty">Loading...</div>
    </div>
  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyD9Qt5x69KsB3VxOuvTbrDXYJHF3nN5acs",
  authDomain: "koma-star.firebaseapp.com",
  projectId: "koma-star",
  storageBucket: "koma-star.firebasestorage.app",
  messagingSenderId: "314141087569",
  appId: "1:314141087569:web:e1861e72db4f9ef5b12570",
  measurementId: "G-HYF2PZY5GR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================
   HELPERS
========================= */

const $ = id => document.getElementById(id);

function showStatus(message,type="success"){

  const box=$("status");

  box.textContent=message;
  box.className="status "+type;
  box.style.display="block";

  setTimeout(()=>{
    box.style.display="none";
  },4000);
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   DATA
========================= */

let videos=[];
let episodes=[];

let editingVideoId=null;


/* =========================
   LOAD CONTENT
========================= */

async function loadVideos(){

  try{

    const snap=await getDocs(
      collection(db,"videos")
    );

    videos=[];

    snap.forEach(item=>{

      videos.push({
        id:item.id,
        ...item.data()
      });

    });

    renderVideos();
    updateStats();

  }catch(error){

    console.error(error);

    showStatus(
      "Videos load failed: "+error.message,
      "error"
    );

  }
}


async function loadEpisodes(){

  try{

    const snap=await getDocs(
      collection(db,"episodes")
    );

    episodes=[];

    snap.forEach(item=>{

      episodes.push({
        id:item.id,
        ...item.data()
      });

    });

    renderEpisodes();
    updateStats();

  }catch(error){

    console.error(error);

    showStatus(
      "Episodes load failed: "+error.message,
      "error"
    );

  }
}


/* =========================
   STATS
========================= */

function updateStats(){

  $("totalVideos").textContent=videos.length;

  $("freeVideos").textContent=
    videos.filter(v=>v.access==="free").length;

  $("premiumVideos").textContent=
    videos.filter(v=>v.access==="premium").length;

  $("totalEpisodes").textContent=
    episodes.length;
}


/* =========================
   RENDER VIDEOS
========================= */

function renderVideos(){

  const box=$("contentList");

  const query=
    $("search").value.trim().toLowerCase();

  const filtered=videos.filter(v=>{

    const text=`
      ${v.title||""}
      ${v.type||""}
      ${v.category||""}
    `.toLowerCase();

    return text.includes(query);
  });

  if(!filtered.length){

    box.innerHTML=
      `<div class="empty">No content found.</div>`;

    return;
  }

  box.innerHTML=filtered.map(v=>{

    const accessClass=
      v.access==="premium"
      ? "premium"
      : "free";

    return `

      <div class="item">

        <div class="item-title">
          ${escapeHtml(v.title)}
        </div>

        <div class="meta">

          <span class="badge">
            ${escapeHtml(v.type)}
          </span>

          <span class="badge ${accessClass}">
            ${v.access==="premium"
              ?"PREMIUM"
              :"FREE WATCH"}
          </span>

          ${v.category
            ? `<span class="badge">
                ${escapeHtml(v.category)}
               </span>`
            :""
          }

        </div>

        <div class="meta">
          ID: ${escapeHtml(v.id)}
        </div>

        <div class="meta">
          ${escapeHtml(v.description||"")}
        </div>

        <div class="actions">

          <button
            class="secondary"
            onclick="editVideo('${v.id}')">
            Edit
          </button>

          <button
            class="danger"
            onclick="removeVideo('${v.id}')">
            Delete
          </button>

        </div>

      </div>

    `;

  }).join("");
}


/* =========================
   RENDER EPISODES
========================= */

function renderEpisodes(){

  const box=$("episodeList");

  if(!episodes.length){

    box.innerHTML=
      `<div class="empty">
        No episodes found.
       </div>`;

    return;
  }

  box.innerHTML=episodes.map(e=>{

    return `

      <div class="item">

        <div class="item-title">
          ${escapeHtml(e.episodeTitle||"Episode")}
        </div>

        <div class="meta">

          Season ${escapeHtml(e.season)}
          • Episode ${escapeHtml(e.episode)}

        </div>

        <div class="meta">

          Series ID:
          ${escapeHtml(e.seriesId)}

        </div>

        <span class="badge ${
          e.access==="premium"
          ?"premium"
          :"free"
        }">

          ${e.access==="premium"
            ?"PREMIUM"
            :"FREE"}

        </span>

        <div class="actions">

          <button
            class="danger"
            onclick="removeEpisode('${e.id}')">
            Delete
          </button>

        </div>

      </div>

    `;

  }).join("");
}


/* =========================
   ADD / UPDATE VIDEO
========================= */

$("contentForm").addEventListener(
  "submit",
  async event=>{

    event.preventDefault();

    const data={

      title:$("title").value.trim(),

      type:$("type").value,

      category:$("category").value.trim(),

      access:$("access").value,

      year:$("year").value.trim(),

      duration:$("duration").value.trim(),

      thumbnail:$("thumbnail").value.trim(),

      videoUrl:$("video").value.trim(),

      description:$("description").value.trim(),

      updatedAt:serverTimestamp()

    };


    if(!data.title){

      showStatus(
        "Title required",
        "error"
      );

      return;
    }


    if(!data.thumbnail){

      showStatus(
        "Thumbnail URL required",
        "error"
      );

      return;
    }


    if(!data.videoUrl){

      showStatus(
        "Video URL required",
        "error"
      );

      return;
    }


    try{

      if(editingVideoId){

        await updateDoc(
          doc(
            db,
            "videos",
            editingVideoId
          ),
          data
        );

        showStatus(
          "Content updated successfully"
        );

        editingVideoId=null;

      }else{

        await addDoc(
          collection(db,"videos"),
          {
            ...data,
            createdAt:serverTimestamp()
          }
        );

        showStatus(
          "Content published successfully"
        );

      }

      resetForm();

      await loadVideos();

    }catch(error){

      console.error(error);

      showStatus(
        "Save failed: "+error.message,
        "error"
      );

    }

  }
);


/* =========================
   EDIT VIDEO
========================= */

window.editVideo=async function(id){

  const item=videos.find(v=>v.id===id);

  if(!item)return;

  editingVideoId=id;

  $("title").value=item.title||"";
  $("type").value=item.type||"movie";
  $("category").value=item.category||"";
  $("access").value=item.access||"free";
  $("year").value=item.year||"";
  $("duration").value=item.duration||"";
  $("thumbnail").value=item.thumbnail||"";
  $("video").value=item.videoUrl||"";
  $("description").value=item.description||"";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  showStatus(
    "Editing: "+item.title
  );
};


/* =========================
   DELETE VIDEO
========================= */

window.removeVideo=async function(id){

  const item=videos.find(v=>v.id===id);

  if(!item)return;

  if(!confirm(
    `Delete "${item.title}"?`
  ))return;

  try{

    await deleteDoc(
      doc(db,"videos",id)
    );

    showStatus(
      "Content deleted"
    );

    await loadVideos();

  }catch(error){

    console.error(error);

    showStatus(
      "Delete failed: "+error.message,
      "error"
    );

  }
};


/* =========================
   ADD EPISODE
========================= */

$("episodeForm").addEventListener(
  "submit",
  async event=>{

    event.preventDefault();

    const data={

      seriesId:$("seriesId").value.trim(),

      season:Number(
        $("season").value
      ),

      episode:Number(
        $("episode").value
      ),

      episodeTitle:
        $("episodeTitle").value.trim(),

      access:
        $("episodeAccess").value,

      videoUrl:
        $("episodeVideo").value.trim(),

      thumbnail:
        $("episodeThumbnail").value.trim(),

      createdAt:
        serverTimestamp()

    };


    if(!data.seriesId){

      showStatus(
        "Series ID required",
        "error"
      );

      return;
    }


    if(!data.episodeTitle){

      showStatus(
        "Episode title required",
        "error"
      );

      return;
    }


    if(!data.videoUrl){

      showStatus(
        "Episode video URL required",
        "error"
      );

      return;
    }


    try{

      await addDoc(
        collection(db,"episodes"),
        data
      );

      showStatus(
        "Episode added successfully"
      );

      $("episodeForm").reset();

      await loadEpisodes();

    }catch(error){

      console.error(error);

      showStatus(
        "Episode save failed: "+
        error.message,
        "error"
      );

    }

  }
);


/* =========================
   DELETE EPISODE
========================= */

window.removeEpisode=async function(id){

  if(!confirm(
    "Delete this episode?"
  ))return;

  try{

    await deleteDoc(
      doc(db,"episodes",id)
    );

    showStatus(
      "Episode deleted"
    );

    await loadEpisodes();

  }catch(error){

    console.error(error);

    showStatus(
      "Episode delete failed: "+
      error.message,
      "error"
    );

  }
};


/* =========================
   SEARCH
========================= */

$("search").addEventListener(
  "input",
  renderVideos
);


/* =========================
   RESET FORM
========================= */

window.resetForm=function(){

  editingVideoId=null;

  $("contentForm").reset();

  $("thumbnailPreview")
    .classList.add("hidden");

  $("videoPreview")
    .classList.add("hidden");

  $("videoPreview")
    .removeAttribute("src");

};


/* =========================
   GALLERY PREVIEW
========================= */

let thumbnailObjectURL=null;

$("thumbnailFile").addEventListener(
  "change",
  event=>{

    const file=
      event.target.files[0];

    const img=
      $("thumbnailPreview");

    if(thumbnailObjectURL){

      URL.revokeObjectURL(
        thumbnailObjectURL
      );

    }

    if(!file){

      img.classList.add("hidden");

      return;
    }

    thumbnailObjectURL=
      URL.createObjectURL(file);

    img.src=
      thumbnailObjectURL;

    img.classList.remove("hidden");

  }
);


let videoObjectURL=null;

$("videoFile").addEventListener(
  "change",
  event=>{

    const file=
      event.target.files[0];

    const video=
      $("videoPreview");

    if(videoObjectURL){

      URL.revokeObjectURL(
        videoObjectURL
      );

    }

    if(!file){

      video.classList.add("hidden");

      video.removeAttribute("src");

      return;
    }

    videoObjectURL=
      URL.createObjectURL(file);

    video.src=
      videoObjectURL;

    video.classList.remove("hidden");

  }
);


/* =========================
   START
========================= */

loadVideos();
loadEpisodes();

</script>

</body>
</html>
